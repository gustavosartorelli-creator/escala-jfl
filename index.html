<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8E4E38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escalas">
<title>Escalas · JFL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){ var t; try { t = JSON.parse(localStorage.getItem('esc_tema')); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t; })();
</script>
<style>
:root{
  --jfl-bronze:#AF8668; --bg:#F5F3F0; --card:#fff; --ink:#111114; --muted:#7A746D; --line:#E3DED8;
  --brand:#8E4E38; --brand-dk:#6F3B2A; --brand-bg:#F6ECE7;
  --ok:#2F6B2A; --ok-bg:#E4F0DE; --warn:#8A6D00; --warn-bg:#FFF5CC; --bad:#B3261E; --bad-bg:#FBE4E1;
  --head:#8E4E38; --card-2:#FAF9F7; --hover:#FBFAF8; --field:#fff; --toast:#111114; --fds:#F3EFEA;
  /* cores dos códigos da escala */
  --t0:#F1E4DA; --t0i:#6F3B2A; --t1:#E2ECF5; --t1i:#1F4E79; --t2:#ECE3F3; --t2i:#5B3A7A; --t3:#E4F0E9; --t3i:#2D5E43;
  --pad:#E3F1DA; --padi:#2F6B2A; --fds2:#E6ECF2; --fer:#FCE3CF;
  --cf:#EFEDEA; --cfi:#5D5751; --cfe:#DDF0F4; --cfei:#155E6E; --caf:#FBE9D9; --cafi:#8A4B12; --cx:#fff; --cxi:#A39C94;
  --r:4px;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --jfl-bronze:#C29A7B; --bg:#141312; --card:#1E1C1A; --ink:#ECE8E3; --muted:#A1998F; --line:#34302C;
  --brand:#D28C6E; --brand-dk:#E3A688; --brand-bg:#2C211C;
  --ok:#6DBA5F; --ok-bg:#1F2E1B; --warn:#D9B23A; --warn-bg:#332B12; --bad:#EC6A60; --bad-bg:#3A1E1B;
  --head:#5E3324; --card-2:#252220; --hover:#292522; --field:#191715; --toast:#2E2A27; --fds:#221F1D;
  --t0:#3A2A22; --t0i:#EBC0A6; --t1:#1E2C3A; --t1i:#9CC3E6; --t2:#2C2236; --t2i:#CDB1E6; --t3:#1E2E25; --t3i:#9AD2B2;
  --pad:#1F2E1B; --padi:#9BD08C; --fds2:#22282E; --fer:#3E2A1C;
  --cf:#2A2725; --cfi:#B5ADA4; --cfe:#173036; --cfei:#8ED3E2; --caf:#3A2A1A; --cafi:#EDB57E; --cx:#1E1C1A; --cxi:#6E6760;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
button{font:inherit;cursor:pointer;border:0;border-radius:var(--r)}
input,select,textarea{font:inherit}
.hidden{display:none!important}
.logo{display:block;fill:currentColor}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:15;background:var(--head);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .logo{width:30px;height:24px;flex:none}
header.top .divider{width:1px;height:28px;background:rgba(255,255,255,.25)}
header.top .logo-predio{height:28px;width:auto;max-width:90px;object-fit:contain;flex:none}
header.top h1{font-size:16px;margin:0;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;color:rgba(255,255,255,.72);font-weight:500;text-transform:uppercase;letter-spacing:.12em}
header.top select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r);padding:5px 8px;font-size:13px}
header.top select option{color:var(--ink);background:var(--card)}
.btn-ghost{background:transparent;color:#fff;padding:6px 12px;font-size:13px;border:1px solid rgba(255,255,255,.4)}
.btn-ghost.ico{padding:6px 9px;line-height:1}
.btn-ghost.ico svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
main{max-width:1400px;margin:0 auto;padding:20px}
@media(max-width:560px){ main{padding:16px} header.top{padding-left:16px;padding-right:16px;gap:10px} header.top h1{min-width:calc(100% - 90px);white-space:normal;line-height:1.25} header.top #divPredio{display:none} }

#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--head);color:#fff}
#login .logo{width:74px;height:60px;margin-bottom:22px}
#login h2{margin:0 0 2px;font:400 26px/1.2 var(--serif)}
#login h2 i{color:var(--jfl-bronze)}
#login p{margin:0 0 28px;color:rgba(255,255,255,.72);font-size:13px;text-transform:uppercase;letter-spacing:.14em}
.pins{display:flex;gap:16px;margin-bottom:12px}
.pins span{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.6)}
.pins span.on{background:#fff;border-color:#fff}
.pins.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#loginMsg{min-height:22px;font-size:14px;color:#FFE0C2;margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pad button{height:74px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);color:#fff;font:300 28px var(--sans)}
.pad button:active{background:rgba(255,255,255,.3)}
.pad .txt{font-size:18px;border:0}
.assinatura{text-align:center;font-size:11px;letter-spacing:.08em;color:var(--muted);padding:8px 16px 28px}
#login .assinatura{color:rgba(255,255,255,.55);margin-top:28px;padding:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;border-radius:0;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.mesnav{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 14px}
.mesnav h2{margin:0;font:700 22px/1.2 var(--sans);letter-spacing:.08em;min-width:220px;text-align:center}
.mesnav h2 small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:2px}
.mesnav .seta{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--brand);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.mesnav .seta:hover{border-color:var(--brand)}
@media(max-width:560px){ .mesnav{gap:10px} .mesnav h2{font-size:18px;min-width:0} }
.deps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dep{background:var(--card);border:1px solid var(--line);padding:8px 14px;text-align:left;color:var(--ink);min-width:150px}
.dep b{display:block;font-size:14px}
.dep small{font-size:12px;color:var(--muted)}
.dep.on{border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--cf);color:var(--cfi)}
.pill.aprovada{background:var(--ok-bg);color:var(--ok)} .pill.enviada{background:var(--warn-bg);color:var(--warn)}
.pill.devolvida{background:var(--bad-bg);color:var(--bad)} .pill.rascunho{background:var(--brand-bg);color:var(--brand)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.btn{background:var(--head);color:#fff;padding:9px 14px;font-size:14px;font-weight:600}
.btn.sec{background:var(--card);color:var(--brand);border:1px solid var(--brand)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--bad)}
.btn.link{background:none;color:var(--muted);text-decoration:underline;padding:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted)}
.aviso{border:1px solid var(--line);border-left:4px solid var(--brand);background:var(--card);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:12px}
.aviso.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.aviso.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.aviso.warn{border-left-color:var(--warn);background:var(--warn-bg)}

/* Paleta (pincel) */
.paleta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;position:sticky;top:var(--hdr,64px);z-index:8;background:var(--bg);padding:6px 0}
.paleta .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:4px}
.pc{min-width:44px;padding:6px 10px;font-weight:700;font-size:14px;border:2px solid transparent}
.pc small{font-weight:500;font-size:11px;margin-left:4px;opacity:.85}
.pc.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}

/* Grade */
.wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:calc(100vh - 220px)}
table.grade{border-collapse:separate;border-spacing:0;font-size:13px;user-select:none}
.grade th,.grade td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0}
.grade thead th{position:sticky;top:0;background:var(--card-2);z-index:3;font-weight:600;font-size:11px;color:var(--muted);padding:4px 0;min-width:34px}
.grade thead th b{display:block;font-size:13px;color:var(--ink)}
.grade thead th.fds{background:var(--fds)}
.grade thead th.dom b{color:var(--brand)}
.grade thead th.cov{background:var(--warn-bg)}
.grade .nome{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;padding:6px 10px;min-width:170px;max-width:220px;font-size:13px;font-weight:600}
.grade thead .nome{z-index:4;background:var(--card-2)}
.grade .nome small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade .nome .sx{font-weight:700;color:var(--brand)}
.grade .nome .sx.falta{color:var(--bad)}
.grade td.c{height:34px;min-width:34px;font-weight:700;cursor:pointer;position:relative}
.grade td.c.ro{cursor:default}
.grade td.seg,.grade th.seg{border-left:2px solid var(--muted)}
.grade td.fds{background:var(--fds)}
.grade td.vazio::after{content:"";position:absolute;inset:7px;border:1px dashed var(--line);border-radius:3px}
.grade td.b{box-shadow:inset 0 0 0 2px var(--bad)}
.grade td.a{box-shadow:inset 0 0 0 2px var(--warn)}
.grade td.b::before{content:"";position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.grade td.tot{font-size:12px;padding:0 8px;white-space:nowrap;color:var(--muted);font-weight:600}
.k0{background:var(--t0)!important;color:var(--t0i)} .k1{background:var(--t1)!important;color:var(--t1i)}
.k2{background:var(--t2)!important;color:var(--t2i)} .k3{background:var(--t3)!important;color:var(--t3i)}
.kF{background:var(--cf)!important;color:var(--cfi)} .kFE{background:var(--cfe)!important;color:var(--cfei)}
.kAF{background:var(--caf)!important;color:var(--cafi)} .kX{background:var(--cx)!important;color:var(--cxi)}
.kFA{background:var(--bad-bg)!important;color:var(--bad)}
/* Grade no formato da planilha */
.grade td.c.kF{background:transparent;color:var(--ink)}
.grade td.c.kF.fds{background:var(--fds2)} .grade td.c.kF.fer{background:var(--fer)}
.kpad{background:var(--pad)!important;color:var(--padi)}
.kout{background:var(--card)!important;color:var(--ink);font-weight:700}
.grade td.fds{background:var(--fds2)} .grade thead th.fds{background:var(--fds2)}
.grade td.fer,.grade thead th.fer{background:var(--fer)}
.grade .hor{font-size:12px;white-space:nowrap;padding:0 8px;color:var(--ink);font-weight:500;background:var(--card)}
.grade thead .hor{font-size:11px;color:var(--muted)}
.grade .res{font-size:12px;padding:0 6px;min-width:30px;color:var(--muted)}
.grade thead th.res{font-size:10px}
.grade tr.secao th{background:var(--brand-bg);color:var(--brand);text-align:left;font-size:11px;letter-spacing:.14em;padding:5px 10px;font-weight:700}
.grade tr.secao th span{position:sticky;left:10px}
.grade.larga td.c{min-width:60px;font-size:11px}
.grade td.c.kout{font-size:11px}
.folgasprev{font-size:14px;font-weight:600;margin:0 2px 8px}
.grade td.res.fok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.grade td.res.fmenos{background:var(--warn-bg);color:var(--warn);font-weight:700}
.grade td.res.fmais{background:var(--fds2);color:var(--ink);font-weight:700}
.grade thead th.res small{font-weight:500;font-size:10px}
.legenda b.lfds{background:var(--fds2)} .legenda b.lfer{background:var(--fer)}
.pc.k0,.pc.k1,.pc.k2,.pc.k3,.pc.kF,.pc.kFE,.pc.kAF,.pc.kX,.pc.kFA{border-color:transparent}
.grade thead th.fer{background:#FCE3CF;color:#8A4B12}
:root[data-theme="dark"] .grade thead th.fer{background:#4A2E1A;color:#EDB57E}
.grade tfoot td{background:var(--card-2);font-size:12px;font-weight:600;color:var(--muted);height:24px}
.grade tfoot tr:first-child td,.grade tfoot tr:first-child th{border-top:2px solid var(--muted)}
.grade tfoot .nome{z-index:3;background:var(--card-2);font-weight:600}
.grade tfoot td.zero{color:var(--bad)}
.pc.on{border-color:var(--ink)!important}
.pc.apagar{background:var(--card);color:var(--muted);border:2px dashed var(--line)}

@media(max-width:560px){
  header.top{position:static}
  .paleta{top:0;gap:4px}
  .paleta .lbl{display:none}
  .pc{min-width:38px;padding:6px 8px}
  .pc small{display:none}
  .deps{gap:6px}
  .dep{min-width:0;flex:1;padding:6px 10px}
  .dep b{font-size:13px}
  .wrap{max-height:72vh}
  .grade .nome{min-width:116px;max-width:130px;padding:5px 8px}
}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:10px 0 4px}
.legenda span b{display:inline-block;min-width:26px;text-align:center;border-radius:3px;padding:1px 4px;margin-right:4px}

.probs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:820px){ .probs{grid-template-columns:1fr} }
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.box h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.box.bad h4{color:var(--bad)} .box.warn h4{color:var(--warn)} .box.ok h4{color:var(--ok)}
.box ul{margin:0;padding-left:18px;font-size:13px;max-height:260px;overflow:auto}
.box li{margin:3px 0}
.box li b{font-weight:600}

/* Listas (equipe, turnos, acessos) */
.sec-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin:22px 2px 8px;display:flex;gap:10px;align-items:baseline}
.sec-t .grow{flex:1}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--hover)}
.li.ro{cursor:default}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--muted);font-size:12px}
.li.off{opacity:.5}
.tagx{font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tagx.bad{border-color:var(--bad);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .ttl{font:400 22px var(--serif);color:var(--ink);margin-bottom:6px}
.regras{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px}
.regra{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.regra:first-child{border-top:0}
.regra b{display:block;font-size:15px}
.regra .tp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-left:6px}
.regra .tp.b{color:var(--bad)} .regra .tp.a{color:var(--warn)}
.regra small{color:var(--muted)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(17,17,20,.55);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.md{background:var(--card);border-radius:var(--r);width:100%;max-width:560px;padding:22px 22px 18px;position:relative}
.md h3{margin:0 0 2px;font:400 24px/1.2 var(--serif)}
.md .x{position:absolute;right:12px;top:10px;background:none;font-size:20px;color:var(--muted);padding:6px 10px}
.md .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.md .acts .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400;background:var(--field)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:12px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.msgs{margin-top:12px;font-size:13px}
.msgs div{padding:6px 10px;border-radius:var(--r);margin-top:4px}
.msgs .e{background:var(--bad-bg);color:var(--bad)} .msgs .w{background:var(--warn-bg);color:var(--warn)} .msgs .i{background:var(--card-2);color:var(--muted)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--toast);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:14px;z-index:40;max-width:90vw}
#toast.err{background:var(--bad)}

/* Exportação (imagem e impressão) */
#exportar{position:fixed;left:-10000px;top:0;background:#fff;color:#111;padding:24px;font:13px/1.35 var(--sans)}
#exportar h2{margin:0;font:400 24px var(--serif)}
#exportar .sub{color:#666;margin:2px 0 12px}
#exportar h2.mes{font:700 26px var(--sans);letter-spacing:.08em;margin:0 0 4px}
#exportar table{border-collapse:collapse}
#exportar th,#exportar td{border:1px solid #bbb;text-align:center;padding:3px 4px;min-width:24px;position:static!important;box-shadow:none!important}
#exportar td.c{height:24px}
#exportar tr.secao th{text-align:left}
#exportar td.c::before,#exportar td.c::after{display:none}
#exportar .grade .nome{min-width:0;max-width:none;white-space:nowrap}
#exportar .grade tfoot td,#exportar .grade tfoot th{background:#f4f4f4}
#exportar .marca{color:#B3261E;font-weight:700;letter-spacing:.1em}
#exportar .ass{display:flex;gap:40px;margin-top:28px}
#exportar .ass div{border-top:1px solid #333;padding-top:4px;min-width:240px;font-size:12px}
@media print{
  body{background:#fff}
  #app,#toast,.ov{display:none!important}
  #exportar{position:static;left:0;padding:0}
  /* imprime as cores (verde-claro, fim de semana, feriado, férias...) em vez de preto e branco */
  html,body,#exportar,#exportar *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>

/* Período da escala (premissas JFL, nov/2026): do dia 16 ao dia 15 do mês seguinte. MES guarda o início (dia 16). */
const addMeses = (iso, n) => { const d = dUTC(iso); d.setUTCMonth(d.getUTCMonth() + n); return isoDe(d); };

const inicio16 = iso => { const d = iso.slice(0, 8) + '16'; return +iso.slice(8) >= 16 ? d : addMeses(d, -1); };

  const fim = addDias(addMeses(p, 1), -1), corta = PER_ESPECIAIS.find(e => e.inicio > p && e.inicio <= fim);
  return corta ? addDias(corta.inicio, -1) : fim;
};

const doDep = (t, dep) => !t.departamentos || t.departamentos.includes(dep);

// Uma linha por sigla (para a paleta), na ordem do cadastro; mostra a versão mais nova
function turnosDoDep(dep, ini = MES, fim = fimPer(MES)){
  const out = [];

  return out;
}

const corTurno = sigla => { const i = siglasOrdem().indexOf(sigla); return i < 0 ? '' : 'k' + (i % 4); };
const clsCod = c => !c ? '' : OUTROS[c] ? OUTROS[c].cls : corTurno(c);
const periodo = t => t.desde && t.ate ? ` de ${ddmm(t.desde)} a ${ddmm(t.ate)}` : t.desde ? ` a partir de ${ddmm(t.desde)}/${t.desde.slice(2, 4)}` : t.ate ? ` até ${ddmm(t.ate)}/${t.ate.slice(2, 4)}` : '';
// Texto da legenda de uma sigla no período: "07:00–16:00 até 15/12/26 · 07:00–16:24 a partir de 16/12/26"
function textoSigla(sigla, dep, ini = MES, fim = fimPer(MES)){
  return versoesDoDep(dep, ini, fim).filter(t => t.sigla === sigla).sort((a, b) => (a.desde || '').localeCompare(b.desde || ''))
    .map(t => textoTurno(t) + periodo(t)).join(' · ');
}
// Horário de um turno num dia (minutos desde 0h do dia; fim pode passar de 24h)
function jornada(t, iso){
  const fds = [0, 6].includes(dow(iso)) && t.inicio_fds && t.fim_fds;
  const ini = tmin(fds ? t.inicio_fds : t.inicio); let fim = tmin(fds ? t.fim_fds : t.fim);
  if (fim <= ini) fim += 1440;
  return { ini, fim, trab: fim - ini - (t.intervalo_min || 0), intervalo: t.intervalo_min || 0, fds: !!fds };
}
function textoTurno(t){
  const s = `${hhmm(t.inicio)}–${hhmm(t.fim)}`, f = t.inicio_fds && t.fim_fds ? ` (sáb/dom ${hhmm(t.inicio_fds)}–${hhmm(t.fim_fds)})` : '';
  return s + f;
}
// Erros de um turno pela CLT (intervalo e jornada diária)
function checarTurno(t){
  const out = [];
  const casos = [['seg–sex', jornada(t, '2026-12-07')]];
  if (t.inicio_fds && t.fim_fds) casos.push(['sáb/dom', jornada(t, '2026-12-05')]);
  for (const [q, j] of casos) {
    const span = j.fim - j.ini;
    if (span > 16 * 60) out.push({ n: 'e', t: `${q}: horário inválido (mais de 16h entre entrada e saída)` });
    if (j.trab > 6 * 60 && j.intervalo < 60) out.push({ n: 'e', t: `${q}: jornada de ${hm(j.trab)} exige intervalo de no mínimo 1h (CLT art. 71)` });
    else if (j.trab > 4 * 60 && j.intervalo < 15) out.push({ n: 'e', t: `${q}: jornada de ${hm(j.trab)} exige intervalo de no mínimo 15 min (CLT art. 71 §1º)` });
    if (j.intervalo > 120) out.push({ n: 'e', t: `${q}: intervalo acima de 2h só com acordo escrito ou convenção (CLT art. 71)` });
    if (j.trab > REGRA.jornadaMax) out.push({ n: 'e', t: `${q}: ${hm(j.trab)} trabalhadas; o máximo é 10h por dia (8h + 2h extras, CLT art. 59)` });
    else if (j.trab > REGRA.jornadaNormal) out.push({ n: 'w', t: `${q}: ${hm(j.trab)} trabalhadas, acima das 8h24 por dia da 5x2; vira hora extra` });
  }
  return out;
}

/* ================= Validação (as regras) ================= */
function funcionariosDaEscala(){
  const ids = new Set(Object.keys(GRADE).filter(id => Object.values(GRADE[id] || {}).some(Boolean)));
  return D.funcionarios.filter(f => f.departamento === DEP && (f.ativo || ids.has(f.id)))
    .sort((a, b) => (b.ativo - a.ativo) || (a.ordem - b.ordem) || a.nome.localeCompare(b.nome, 'pt-BR'));
}

// Dias em ordem → "03/01, 05/01 a 07/01, 20/01"
function periodos(ds){
  const out = []; let ini = null, ant = null;
  for (const d of ds.concat([null])) {
    if (d && ant && addDias(ant, 1) === d) { ant = d; continue; }
    if (ini) out.push(ini === ant ? ddmm(ini) : `${ddmm(ini)} a ${ddmm(ant)}`);
    ini = ant = d;
  }
  return out.join(', ');
}

function validar(){
  const ini = MES, fim = fimPer(MES), antIni = perAnterior(MES);
  const ant = E.anterior, antTurnos = (ant && ant.turnos && ant.turnos.length) ? ant.turnos : D.turnos;
  const cel = {}, lista = [];
  const marca = (fid, iso, n, msg) => {
    if (iso < ini || iso > fim) return;
    const k = fid + '|' + iso, c = cel[k] || (cel[k] = { n: 'a', msgs: [] });
    if (n === 'b') c.n = 'b'; if (!c.msgs.includes(msg)) c.msgs.push(msg);
  };
  const add = (n, f, texto) => lista.push({ n, fid: f && f.id, nome: f && f.nome, texto });
  // Situação de um dia: trab (com horário absoluto), folga, x, vazio (no mês), ? (desconhecido, fora do mês sem dados)
  const info = (f, iso) => {
    let c, lt;
    if (iso >= ini && iso <= fim) { c = (GRADE[f.id] || {})[iso] || ''; lt = D.turnos; }
    else if (iso >= antIni && iso < ini && ant) { c = ((ant.grade || {})[f.id] || {})[iso] || ''; lt = antTurnos; }
    else return { tipo: '?' };
    if (!c) return { tipo: iso >= ini ? 'vazio' : '?' };
    if (c === 'NA') return { tipo: 'x', c };
    if (FOLGA_REGULAR.includes(c)) return { tipo: 'folga', c };
    if (AUSENCIA.includes(c)) return { tipo: 'ausencia', c };
    if (OUTROS[c]) return { tipo: 'extra', c };   // FC, BH, XX: folga a mais, não conta nas 2 da semana
    const t = turnoEm(c, iso, lt) || turnoEm(c, iso);
    if (!t) return { tipo: D.turnos.some(t => t.sigla === c) ? 'foraVigencia' : 'invalido', c };
    const j = jornada(t, iso), base = Math.round((dUTC(iso) - dUTC(antIni)) / 864e5) * 1440;
    return { tipo: 'trab', c, t, ini: base + j.ini, fim: base + j.fim, trab: j.trab };
  };

  const funcs = funcionariosDaEscala();
  const dias = []; for (let d = ini; d <= fim; d = addDias(d, 1)) dias.push(d);
  const totais = {};

  for (const f of funcs) {
    const tot = { min: 0, folgas: 0, domFolga: 0 }; totais[f.id] = tot;
    if (!f.sexo && !f.sem_regras) add('b', f, 'Informe se é mulher ou homem (aba Equipe): a regra do domingo depende disso');
    // Dias vazios e códigos inválidos
    let vazios = 0; const diasVazios = [];
    for (const d of dias) {
      const x = info(f, d);
      if (x.tipo === 'vazio') { vazios++; diasVazios.push(d); }
      if (x.tipo === 'invalido') { marca(f.id, d, 'b', `Turno "${x.c}" não existe mais`); add('b', f, `${ddmm(d)}: turno "${x.c}" não existe mais`); }
      if (x.tipo === 'foraVigencia') { const msg = `${ddmm(d)}: o turno ${x.c} não vale nesta data (${D.turnos.filter(t => t.sigla === x.c).map(t => textoTurno(t) + periodo(t)).join('; ')})`; marca(f.id, d, 'b', msg); add('b', f, msg); }
      if (x.tipo === 'trab' && !doDep(x.t, DEP)) { marca(f.id, d, 'b', `Turno ${x.c} não é deste departamento`); add('b', f, `${ddmm(d)}: turno ${x.c} não é usado em ${DEPTOS[DEP]}`); }
      if (x.tipo === 'trab') tot.min += x.trab;
      if (x.tipo === 'folga') { tot.folgas++; if (dow(d) === 0) tot.domFolga++; }
    }
    if (vazios) add('b', f, `${vazios} dia${vazios > 1 ? 's' : ''} sem marcação (${periodos(diasVazios)})`);
    if (f.sem_regras) continue; // cooperada / não CLT: só confere se todos os dias estão marcados

    // Semanas (segunda a domingo) que tocam o mês: horas e folgas
    for (let s = segundaDe(ini); s <= fim; s = addDias(s, 7)) {
      const ds = [0,1,2,3,4,5,6].map(i => addDias(s, i)), r = regraEm(ds[0]);
      const xs = ds.map(d => info(f, d));
      const min = xs.reduce((a, x) => a + (x.tipo === 'trab' ? x.trab : 0), 0);
      // Folgas regulares da semana: X e FP. Férias, atestado, falta e "não se aplica" reduzem o que falta; FC, BH e XX não contam.
      const folgas = xs.filter(x => x.tipo === 'folga').length;
      const desconhecidos = xs.filter(x => ['?', 'vazio', 'x', 'ausencia'].includes(x.tipo)).length;
      const per = `Semana ${ddmm(ds[0])} a ${ddmm(ds[6])}`;
      if (min > r.horas * 60) {
        // Antes de 16/12/2026 (regra antiga) passar do limite vira hora extra: alerta. Na regra nova, bloqueia.
        const antiga = r.desde < '2026-12-16', n = antiga ? 'a' : 'b';
        const msg = `${per}: ${hm(min)} de trabalho; o limite é ${r.horas}h por semana${antiga ? ` (${hm(min - r.horas * 60)} de hora extra)` : ''}`;
        add(n, f, msg); if (!antiga) ds.forEach((d, i) => xs[i].tipo === 'trab' && marca(f.id, d, n, msg));
      }
      const precisa = Math.max(0, r.folgas - desconhecidos);
      if (folgas < precisa) {
        const extras = xs.filter(x => x.tipo === 'extra').map(x => x.c);
        const msg = `${per}: ${folgas} folga${folgas === 1 ? '' : 's'} regular${folgas === 1 ? '' : 'es'} (X); o mínimo é ${r.folgas} por semana${extras.length ? ` — ${extras.join(', ')} não substitui a folga da semana` : ''}`;
        add('b', f, msg); ds.forEach((d, i) => xs[i].tipo === 'trab' && marca(f.id, d, 'b', msg));
      }
    }

    // Dias seguidos de trabalho e descanso entre jornadas (olhando também o fim do mês anterior)
    let seguidos = 0, antes = null;
    for (let d = antIni; d <= fim; d = addDias(d, 1)) {
      const x = info(f, d);
      if (x.tipo === 'trab') {
        seguidos++;
        if (seguidos > REGRA.diasSeguidosMax && d >= ini) {
          const msg = `${ddmm(d)}: ${seguidos}º dia seguido de trabalho; 7 ou mais dias seguidos não é permitido`;
          marca(f.id, d, 'b', msg); add('b', f, msg);
        } else if (seguidos > REGRA.diasSeguidosIdeal && d >= ini) {
          const msg = `${ddmm(d)}: ${seguidos}º dia seguido de trabalho; o ideal é até ${REGRA.diasSeguidosIdeal} (6 só excepcionalmente, na virada da semana)`;
          marca(f.id, d, 'a', msg); add('a', f, msg);
        }
        if (antes && antes.tipo === 'trab' && d >= ini) {
          const desc = x.ini - antes.fim;
          if (desc < REGRA.descansoMin) {
            const msg = `${ddmm(d)}: só ${hm(desc)} de descanso desde o turno anterior (mínimo 11h, CLT art. 66)`;
            marca(f.id, d, 'b', msg); add('b', f, msg);
          }
        }
      } else seguidos = 0;
      antes = x;
    }

    // Domingos
    for (const d of dias.filter(d => dow(d) === 0 && d >= REGRA.domingoDesde)) {
      const x = info(f, d);
      if (x.tipo !== 'trab') continue;
      let n = 1, p = addDias(d, -7);
      while (n < 60 && p >= REGRA.domingoDesde) { const y = info(f, p); if (y.tipo !== 'trab') break; n++; p = addDias(p, -7); }
      if (f.sexo === 'F' && n >= REGRA.domingoMulherSemanas) {
        const msg = `${ddmm(d)}: ${n} domingos seguidos de trabalho; mulher precisa de folga no domingo a cada 15 dias (CLT art. 386)`;
        marca(f.id, d, 'b', msg); add('b', f, msg);
      } else if (f.sexo === 'M' && n >= REGRA.domingoHomemSemanas) {
        const msg = `${ddmm(d)}: ${n} domingos seguidos de trabalho; homem precisa de ao menos 1 domingo de folga a cada 4 semanas`;
        marca(f.id, d, 'b', msg); add('b', f, msg);
      }
    }

    // Feriado trabalhado: compensar com folga (FC), à parte das 2 folgas da semana
    const ferTrab = dias.filter(d => FERIADOS[d] && info(f, d).tipo === 'trab');
    const fcs = dias.filter(d => (GRADE[f.id] || {})[d] === 'FC').length;
    if (ferTrab.length > fcs) add('a', f, `Trabalha no feriado ${ferTrab.map(d => `${ddmm(d)} (${FERIADOS[d]})`).join(', ')}: lançar ${ferTrab.length - fcs} folga${ferTrab.length - fcs > 1 ? 's' : ''} compensatória${ferTrab.length - fcs > 1 ? 's' : ''} (FC)`);
  }

  // Semana de transição (a lei muda no meio da semana): segue a regra antiga, com um lembrete
  for (let s = segundaDe(ini); s <= fim; s = addDias(s, 7)) {
    const dom = addDias(s, 6), nova = LEI.find(r => r.desde > s && r.desde <= dom);
    if (nova && funcs.length) add('a', null, `Semana de ${ddmm(s)} a ${ddmm(dom)} é de transição: a lei muda em ${ddmm(nova.desde)}, no meio da semana. Nela ainda vale a regra antiga (${regraEm(s).horas}h e ${regraEm(s).folgas} folga${regraEm(s).folgas > 1 ? 's' : ''}; o que passar é hora extra). ${nova.horas}h e ${nova.folgas} folgas por semana a partir de ${ddmm(addDias(s, 7))}.`);
  }

  // Turnos usados: intervalo e jornada diária
  const usados = new Set(); funcs.forEach(f => dias.forEach(d => { const c = (GRADE[f.id] || {})[d]; const t = c && !OUTROS[c] && turnoEm(c, d); if (t) usados.add(t); }));
  const mais8 = [];
  for (const t of usados)
    for (const m of checarTurno(t)) {
      if (m.n === 'w' && /acima das 8h24/.test(m.t)) { const r = horaLonga(t, t.desde || ini); if (!mais8.includes(r)) mais8.push(r); continue; }
      add(m.n === 'e' ? 'b' : 'a', null, `Horário ${horaLonga(t, t.desde || ini)}${periodo(t)}: ${m.t}`);
    }
  if (mais8.length) add('a', null, `Horário${mais8.length > 1 ? 's' : ''} ${mais8.join(', ')} com mais de 8h24 de trabalho por dia (o padrão da 5x2): vira hora extra`);

  // Departamento fechado no domingo: domingo só pode ser folga (F, FE, AF ou X)
  if (fechaDomingo(DEP)) for (const f of funcs) for (const d of dias.filter(d => dow(d) === 0)) {
    const c = (GRADE[f.id] || {})[d];
    if (c && !OUTROS[c]) { const msg = `${ddmm(d)}: ${DEPTOS[DEP]} não funciona aos domingos`; marca(f.id, d, 'b', msg); add('b', f, msg); }
  }

  // Cobertura mínima por turno e dia
  const cob = cobertura(DEP), diaCob = {};
  for (const [sigla, minimo] of Object.entries(cob)) {
    if (!(+minimo > 0) || !turnosDoDep(DEP).some(t => t.sigla === sigla)) continue;
    const faltas = [];
    for (const d of dias) {
      const n = funcs.filter(f => (GRADE[f.id] || {})[d] === sigla).length;
      if (n < minimo) { faltas.push(`${ddmm(d)} (${n})`); (diaCob[d] = diaCob[d] || []).push(`${sigla}: ${n} de ${minimo}`); }
    }
    if (faltas.length) add('a', null, `Turno ${sigla} abaixo do mínimo de ${minimo} pessoa${minimo > 1 ? 's' : ''} em ${faltas.length} dia${faltas.length > 1 ? 's' : ''}: ${faltas.slice(0, 8).join(', ')}${faltas.length > 8 ? '…' : ''}`);
  }

  return { cel, lista, totais, diaCob, funcs, dias,
    bloqueios: lista.filter(x => x.n === 'b').length, alertas: lista.filter(x => x.n === 'a').length };
}

const cobertura = dep => (((D.config || {})[dep] || {}).cobertura) || {};
const fechaDomingo = dep => !!((D.config || {})[dep] || {}).fecha_domingo;
const celulaEstilo = dep => ((D.config || {})[dep] || {}).celula || (dep === 'manutencao' ? 'horario' : 'vazio');
// Preenchimento automático (salvo na próxima mudança):
// escala nova: todo dia = horário da pessoa (como a planilha em branco), e X no domingo se o departamento não abre;
// escala existente: só os domingos vazios dos departamentos fechados no domingo.
function preencherDomingos(){
  if (!editavel()) return;
  const nova = !E.escala;
  if (!nova && !fechaDomingo(DEP)) return;
  for (const f of funcionariosDaEscala().filter(f => f.ativo)) {
    const g = GRADE[f.id] = GRADE[f.id] || {};
    for (let d = MES; d <= fimPer(MES); d = addDias(d, 1)) {
      if (g[d]) continue;
      if (dow(d) === 0 && fechaDomingo(DEP)) g[d] = 'X';
      else if (nova && f.turno_padrao && turnoEm(f.turno_padrao, d)) g[d] = f.turno_padrao;
    }
  }
}

/* ===== Como a planilha: horários escritos, seções, "Horário" ao lado do nome ===== */
const hhmm2 = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const hhCurto = m => { m = ((m % 1440) + 1440) % 1440; const h = String(Math.floor(m / 60)).padStart(2, '0'); return m % 60 ? h + ':' + String(m % 60).padStart(2, '0') : h; };
const horaCurta = (t, iso) => { const j = jornada(t, iso); return hhCurto(j.ini) + '–' + hhCurto(j.fim); };      // 09–18, 08–17:24
const horaLonga = (t, iso) => { const j = jornada(t, iso); return hhmm2(j.ini) + ' às ' + hhmm2(j.fim); };       // 09:00 às 17:20
// Dia do mês em que algum horário do departamento muda (ex.: 16/12/2026); null se não muda
function corteDoMes(){
  const fim = fimPer(MES);
  const ds = D.turnos.filter(t => doDep(t, DEP) && t.desde && t.desde > MES && t.desde <= fim).map(t => t.desde).sort();
  return ds[0] || null;
}
// Horário de cada pessoa em cada parte do mês: o mais usado nos dias de trabalho (ou o turno padrão)
function horariosPessoa(f, corte){
  const partes = corte ? [[MES, addDias(corte, -1)], [corte, fimPer(MES)]] : [[MES, fimPer(MES)]];
  return partes.map(([a, b]) => {
    const n = {};
    for (let d = a; d <= b; d = addDias(d, 1)) {
      const c = (GRADE[f.id] || {})[d], t = c && !OUTROS[c] && turnoEm(c, d);
      if (t) { const k = horaLonga(t, d); n[k] = (n[k] || 0) + 1; }
    }
    const top = Object.entries(n).sort((x, y) => y[1] - x[1])[0];
    if (top) return top[0];
    const t = f.turno_padrao && (turnoEm(f.turno_padrao, b) || turnoEm(f.turno_padrao, a));
    return t ? horaLonga(t, b) : '';
  });
}
// O que aparece numa célula
function celInfo(f, d, hor, corte){
  const c = (GRADE[f.id] || {})[d] || '';
  if (!c) return { c, txt: '', cls: 'vazio' };
  if (OUTROS[c]) return { c, txt: c, cls: OUTROS[c].cls };
  const t = turnoEm(c, d);
  if (!t) return { c, txt: '?', cls: 'kFA' };
  const padrao = horaLonga(t, d) === hor[corte && d >= corte ? 1 : 0];
  return { c, txt: padrao && celulaEstilo(DEP) === 'vazio' ? '' : horaCurta(t, d), cls: padrao ? 'kpad' : 'kout', padrao };
}
// Sigla que dá o horário da pessoa naquele dia (para o botão "Trabalha")
function padraoSigla(f, d){
  const hor = horariosPessoa(f, corteDoMes())[corteDoMes() && d >= corteDoMes() ? 1 : 0];
  const t = versoesDoDep(DEP, d, d).find(t => vale(t, d) && horaLonga(t, d) === hor);
  return t ? t.sigla : (f.turno_padrao && turnoEm(f.turno_padrao, d) ? f.turno_padrao : null);
}
// Outros horários do departamento para a paleta, escritos como na planilha (sem repetir)
function horariosPaleta(){
  const fim = fimPer(MES), out = [];
  for (const t of turnosDoDep(DEP)) {
    const dRef = t.ate && t.ate < fim ? t.ate : fim, rot = horaCurta(t, dRef);
    if (!out.some(o => o.rotulo === rot)) out.push({ sigla: t.sigla, rotulo: rot, texto: textoSigla(t.sigla, DEP) });
  }
  return out;
}
const SECOES = ['LÍDER', 'RECEPÇÃO', 'CAMAREIRA', 'ROUPARIA', 'ROUPARIA / SUPERVISORA', 'EQUIPE ASG', 'MANUTENCISTA', 'GOVERNANTA'];
const ordemSecao = s => { const i = SECOES.indexOf(s); return i < 0 ? 50 : i; };
const SEM_PLAN = ['D', 'SE', 'T', 'Q', 'Q', 'SEX', 'S'];
const PERIODOS = [['Manhã', 0, 600], ['Inter', 600, 780], ['Tarde', 780, 1440]]; // até 9h59, 10h–12h59, a partir de 13h

// Folgas previstas no mês: para cada domingo do mês, as folgas da semana (1 na 6x1, 2 na 5x2),
// mais os feriados que não caem no domingo (o domingo já é folga)
// Premissas JFL: a referência de folgas regulares do período é a quantidade de sábados e domingos (equalização).
// Feriado trabalhado é compensado à parte, com FC.
const CODIGOS_FOLGA = FOLGA_REGULAR;
function folgasPrevistas(){
  // Semanas ainda na 6x1 (1 folga) contam só o domingo; semanas na 5x2 contam sábado e domingo
  const fim = fimPer(MES); let sab = 0, dom = 0; const fers = [];
  for (let d = MES; d <= fim; d = addDias(d, 1)) {
    if (dow(d) === 0) dom++;
    if (dow(d) === 6 && regraEm(segundaDe(d)).folgas === 2) sab++;
    if (FERIADOS[d]) fers.push(d);
  }
  const total = sab + dom;
  return { total, texto: `Referência de folgas no período: ${sab} sábado${sab === 1 ? '' : 's'}${sab && regraEm(MES).folgas === 1 ? ' (só das semanas já na 5x2)' : ''} + ${dom} domingo${dom === 1 ? '' : 's'} = ${total} folgas regulares (X)${fers.length ? `. Feriados: ${fers.map(d => ddmm(d) + ' ' + FERIADOS[d]).join(', ')} (quem trabalhar ganha folga compensatória, FC, à parte)` : ''}` };
}

function tabelaEscala({ ed = false, marcas = false } = {}){
  const corte = corteDoMes(), dias = V.dias, funcs = V.funcs;
  const usados = Object.keys(OUTROS).filter(k => k === 'X' || funcs.some(f => dias.some(d => (GRADE[f.id] || {})[d] === k)));
  const larg = celulaEstilo(DEP) === 'horario' ? 'larga' : '';
  let h = `<table class="grade ${larg}" id="grade"><thead><tr><th class="nome">EQUIPE</th><th class="hor">HORÁRIO</th>${corte ? `<th class="hor">APÓS ${ddmm(corte)}</th>` : ''}`;
  for (const d of dias) {
    const w = dow(d), cov = V.diaCob[d], fer = FERIADOS[d];
    const tit = [fer ? 'Feriado: ' + fer : '', cov ? 'Abaixo do mínimo: ' + cov.join(', ') : ''].filter(Boolean).join('\n');
    h += `<th class="dia ${[0, 6].includes(w) ? 'fds' : ''} ${w === 1 ? 'seg' : ''} ${fer ? 'fer' : ''} ${cov ? 'cov' : ''}" ${tit ? `title="${esc(tit)}"` : ''}>${SEM_PLAN[w]}<b>${+d.slice(8)}</b></th>`;
  }
  const prev = folgasPrevistas();
  h += `<th class="res">Trab.</th><th class="res" title="${esc(prev.texto)}">Folgas<br><small>de ${prev.total}</small></th>${usados.map(k => `<th class="res">${k === 'F' ? 'Falta' : k}</th>`).join('')}</tr></thead><tbody>`;
  const ncol = 2 + (corte ? 1 : 0) + dias.length + 2 + usados.length;
  // Seções na ordem da planilha
  const secoes = [];
  for (const f of funcs) { const s = f.secao || (f.cargo || 'EQUIPE').toUpperCase(); let x = secoes.find(x => x.nome === s); if (!x) secoes.push(x = { nome: s, fs: [] }); x.fs.push(f); }
  secoes.sort((a, b) => (ordemSecao(a.nome) - ordemSecao(b.nome)) || (Math.min(...a.fs.map(f => f.ordem)) - Math.min(...b.fs.map(f => f.ordem))));
  for (const s of secoes) {
    h += `<tr class="secao"><th colspan="${ncol}"><span>${esc(s.nome)}</span></th></tr>`;
    for (const f of s.fs) {
      const hor = horariosPessoa(f, corte), t = V.totais[f.id];
      const avisoSexo = marcas && !f.sem_regras && !f.sexo ?' <span class="sx falta" title="Informe na aba Equipe se é mulher ou homem">sexo?</span>' : '';
      h += `<tr><th class="nome" title="${esc(`${f.cargo || ''} · ${hm(t.min)} no mês${f.sem_regras ? ' · não CLT' : ''}`)}">${esc(f.nome)}${f.ativo ? '' : ' <span class="tagx">inativo</span>'}${avisoSexo}</th>
        <td class="hor">${esc(hor[0] || '—')}</td>${corte ? `<td class="hor">${esc(hor[1] || '—')}</td>` : ''}`;
      const cont = {}; let trab = 0;
      for (const d of dias) {
        const w = dow(d), m = marcas && V.cel[f.id + '|' + d], ci = celInfo(f, d, hor, corte);
        if (ci.c && !OUTROS[ci.c]) trab++; else if (ci.c) cont[ci.c] = (cont[ci.c] || 0) + 1;
        h += `<td class="c ${ed ? '' : 'ro'} ${ci.cls} ${[0, 6].includes(w) ? 'fds' : ''} ${FERIADOS[d] ? 'fer' : ''} ${w === 1 ? 'seg' : ''} ${m ? m.n : ''}" data-f="${f.id}" data-d="${d}" title="${esc(SEM_NOME[w] + ' ' + ddmm(d) + (ci.c && !OUTROS[ci.c] && turnoEm(ci.c, d) ? ' · ' + horaLonga(turnoEm(ci.c, d), d) : ci.c ? ' · ' + OUTROS[ci.c].nome : '') + (m ? '\n' + m.msgs.join('\n') : ''))}">${esc(ci.txt)}</td>`;
      }
      // Folgas do mês (X, FC, FP, XX, BH) contra as previstas; quem teve férias, atestado, falta ou admissão no mês fica sem cor
      const folgas = CODIGOS_FOLGA.reduce((a, k) => a + (cont[k] || 0), 0);
      const fora = ['FE', 'AT', 'F', 'NA'].some(k => cont[k]);
      const cf = fora ? '' : folgas === prev.total ? 'fok' : folgas < prev.total ? 'fmenos' : 'fmais';
      const tf = fora ? 'Teve férias, atestado, falta ou admissão no mês: o previsto não se aplica' : folgas === prev.total ? 'Bate com o previsto' : folgas < prev.total ? `${prev.total - folgas} a menos que o previsto` : `${folgas - prev.total} a mais que o previsto`;
      h += `<td class="res num">${trab}</td><td class="res num ${cf}" title="${esc(tf)}">${folgas}</td>${usados.map(k => `<td class="res num">${cont[k] || ''}</td>`).join('')}</tr>`;
    }
  }
  // Rodapé como o da planilha: quantos por período e no dia
  const periodoDe = (t, d) => { const ini = jornada(t, d).ini % 1440; return PERIODOS.findIndex(p => ini >= p[1] && ini < p[2]); };
  const temPer = PERIODOS.map((p, i) => versoesDoDep(DEP, MES, fimPer(MES)).some(t => periodoDe(t, t.desde || MES) === i));
  const linhas = PERIODOS.map((p, i) => [p[0], i]).filter((_, i) => temPer[i]).concat([['Total no dia', -1]]);
  h += `</tbody><tfoot>`;
  for (const [rot, i] of linhas) {
    h += `<tr><th class="nome">${rot}</th><td class="hor"></td>${corte ? '<td class="hor"></td>' : ''}${dias.map(d => {
      const n = funcs.filter(f => { const c = (GRADE[f.id] || {})[d], t = c && !OUTROS[c] && turnoEm(c, d); return t && (i < 0 || periodoDe(t, d) === i); }).length;
      const fechado = dow(d) === 0 && fechaDomingo(DEP);
      return `<td class="${n || fechado || i >= 0 ? '' : 'zero'} ${[0, 6].includes(dow(d)) ? 'fds' : ''}">${n}</td>`;
    }).join('')}<td class="res"></td><td class="res"></td>${usados.map(() => '<td class="res"></td>').join('')}</tr>`;
  }
  return h + `</tfoot></table>`;
}

/* ================= Aba Escala ================= */
const statusDe = dep => { const e = (D.escalas || []).find(e => e.departamento === dep); return e ? e.status : 'nova'; };
function editavel(){
  const st = E.escala ? E.escala.status : 'nova';
  return podeMontar(DEP) && ['nova', 'rascunho', 'devolvida'].includes(st);
}

function renderEscala(){
  const deps = deptosVisiveis();
  const st = E.escala ? E.escala.status : 'nova', ed = editavel();
  preencherDomingos();
  V = validar();
  let h = '';
  // Mês em destaque, com setas para o anterior e o seguinte
  h += `<div class="mesnav"><button class="seta" id="mPrev" aria-label="Mês anterior" title="Mês anterior">‹</button>
    <h2>${esc(nomePer(MES).toUpperCase())}<small>${datasPer(MES)}</small></h2>
    <button class="seta" id="mNext" aria-label="Próximo mês" title="Próximo mês">›</button></div>`;
  // Departamentos com a situação do mês
  h += `<div class="deps">${deps.map(d => { const s = statusDe(d); return `<button class="dep ${d === DEP ? 'on' : ''}" data-dep="${d}"><b>${DEPTOS[d]}</b><span class="pill ${s}">${STATUS[s]}</span></button>`; }).join('')}</div>`;

  // Situação e ações
  const es = E.escala;
  let info = '';
  if (st === 'nova') info = podeMontar(DEP) ? 'Escala ainda não iniciada. Escolha um código na paleta e toque nos dias.' : 'O líder ainda não começou esta escala.';
  else if (st === 'rascunho') info = `Rascunho${es.salvo_por ? `, salvo por ${esc(es.salvo_por)} em ${quando(es.salvo_em)}` : ''}.`;
  else if (st === 'enviada') info = `Enviada por ${esc(es.enviada_por)} em ${quando(es.enviada_em)}. ${podeAprovar() ? 'Confira e aprove ou devolva.' : 'Aguardando o Gerente Geral.'}`;
  else if (st === 'aprovada') info = `Aprovada por ${esc(es.aprovada_por)} em ${quando(es.aprovada_em)}. Para mudar, reabra (volta para aprovação).`;
  else if (st === 'devolvida') info = `Devolvida pelo Gerente Geral: <b>${esc(es.motivo || '')}</b>`;
  h += `<div class="aviso ${st === 'aprovada' ? 'ok' : st === 'devolvida' ? 'bad' : st === 'enviada' ? 'warn' : ''}">${info}</div>`;

  const acts = [];
  if (ed && V.funcs.length) acts.push(`<button class="btn" id="bEnviar" ${V.bloqueios ? 'disabled title="Corrija os bloqueios primeiro"' : ''}>Enviar para aprovação</button>`);
  if (st === 'enviada' && podeAprovar()) acts.push(`<button class="btn ok" id="bAprovar">Aprovar</button><button class="btn danger" id="bDevolver">Devolver</button>`);
  if (['enviada', 'aprovada'].includes(st) && podeMontar(DEP)) acts.push(`<button class="btn sec" id="bReabrir">Reabrir para editar</button>`);
  h += `<div class="toolbar"><span class="hint grow" id="salvoInfo"></span>${acts.join('')}
    <button class="btn sec" id="bImagem">Imagem (WhatsApp)</button><button class="btn sec" id="bImprimir">Imprimir / PDF</button></div>`;

  // Paleta: horário da pessoa, outros horários (escritos como na planilha) e os códigos da equipe
  if (ed && V.funcs.length) {
    const outros = horariosPaleta();
    const cods = [['*', 'kpad', 'Trabalha', 'No horário da própria pessoa (como a célula em branco da planilha)']]
      .concat(outros.map(o => [o.sigla, 'kout', o.rotulo, `Outro horário: ${o.texto}`]))
      .concat(Object.entries(OUTROS).map(([k, o]) => [k, o.cls, k, o.nome]));
    if (!cods.some(c => c[0] === PINCEL) && PINCEL !== '') PINCEL = 'X';
    h += `<div class="paleta" id="paleta"><span class="lbl">Marcar</span>${cods.map(([k, cls, rot, n]) => `<button class="pc ${cls} ${PINCEL === k ? 'on' : ''}" data-k="${esc(k)}" title="${esc(n)}">${esc(rot)}${OUTROS[k] ? `<small>${esc(OUTROS[k].nome.split(' (')[0])}</small>` : ''}</button>`).join('')}
      <button class="pc apagar ${PINCEL === '' ? 'on' : ''}" data-k="" title="Apagar">Apagar</button>
      <span class="grow"></span>
      <button class="btn link" id="bRepetir" title="Copia os dias 1 a 7 para o resto do mês (mesmo dia da semana)">Repetir 1ª semana</button>
      <button class="btn link" id="bLimpar">Limpar</button></div>`;
  }

  if (!V.funcs.length) {
    h += `<div class="empty"><div class="ttl">Ninguém na equipe de ${DEPTOS[DEP]}</div>Cadastre as pessoas na aba Equipe.</div>`;
    $('#conteudo').innerHTML = h; ligarEscala(); return;
  }

  // Grade no formato da planilha
  h += `<div class="folgasprev">${esc(folgasPrevistas().texto)}</div>`;
  h += `<div class="wrap" id="wrap">${tabelaEscala({ ed, marcas: true })}</div>`;

  // Legenda, como a da planilha
  const fers = V.dias.filter(d => FERIADOS[d]);
  h += `<div class="legenda"><span><b class="kpad">&nbsp;&nbsp;</b>${celulaEstilo(DEP) === 'vazio' ? 'Em branco = trabalha no horário da pessoa' : 'Verde-claro = horário da pessoa'}</span>
    ${Object.entries(OUTROS).map(([k, o]) => `<span><b class="${o.cls}">${k}</b>${esc(o.nome)}</span>`).join('')}
    <span><b class="lfds">&nbsp;&nbsp;</b>Fim de semana</span>
    ${fers.length ? `<span><b class="lfer">&nbsp;&nbsp;</b>Feriado: ${fers.map(d => `${ddmm(d)} ${esc(FERIADOS[d])}`).join(', ')}</span>` : ''}</div>`;
  const r = regraEm(segundaDe(fimPer(MES))), r0 = regraEm(MES);
  h += `<p class="hint">Regra em vigor: ${r0 === r ? esc(r.nome) : `${esc(r0.nome)} até a semana de transição; a partir de ${ddmm(segundaDe(addDias(r.desde, 6)))} ${esc(r.nome)}`}. Semanas de segunda a domingo (linha mais grossa = segunda-feira).</p>`;

  // Problemas
  const bl = V.lista.filter(x => x.n === 'b'), al = V.lista.filter(x => x.n === 'a');
  const li = x => `<li>${x.nome ? `<b>${esc(x.nome)}</b>: ` : ''}${esc(x.texto)}</li>`;
  h += `<div class="probs">
    ${bl.length ? `<div class="box bad"><h4>Bloqueios (${bl.length}) · impedem o envio</h4><ul>${bl.map(li).join('')}</ul></div>`
                : `<div class="box ok"><h4>Sem bloqueios</h4><div class="hint">Todas as regras obrigatórias estão cumpridas.</div></div>`}
    ${al.length ? `<div class="box warn"><h4>Alertas (${al.length}) · conferir</h4><ul>${al.map(li).join('')}</ul></div>`
                : `<div class="box"><h4>Alertas</h4><div class="hint">Nenhum.</div></div>`}
  </div>`;
  if (E.historico && E.historico.length) {
    const nomes = { enviar: 'enviou', aprovar: 'aprovou', devolver: 'devolveu', reabrir: 'reabriu' };
    h += `<div class="sec-t">Histórico</div><div class="tbl">${E.historico.map(x => `<div class="li ro"><div class="t">${esc(x.por)} ${nomes[x.acao] || x.acao}${x.motivo ? `: ${esc(x.motivo)}` : ''}</div><small class="hint">${quando(x.em)}</small></div>`).join('')}</div>`;
  }
  $('#conteudo').innerHTML = h;
  ligarEscala();
  mostrarSalvo();
}

function ligarEscala(){
  document.querySelectorAll('.dep').forEach(b => b.onclick = () => b.dataset.dep !== DEP && trocarDep(b.dataset.dep));
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
  on('mPrev', () => irMes(-1)); on('mNext', () => irMes(1));
  on('bEnviar', enviar); on('bAprovar', () => acao('aprovar')); on('bDevolver', devolver); on('bReabrir', reabrir);
  on('bImprimir', imprimir); on('bImagem', imagem); on('bRepetir', repetirSemana); on('bLimpar', limpar);
  const pal = $('#paleta');
  if (pal) pal.onclick = e => { const b = e.target.closest('.pc'); if (!b) return; PINCEL = b.dataset.k; store.set('pincel', PINCEL); pal.querySelectorAll('.pc').forEach(x => x.classList.toggle('on', x === b)); };
  const g = $('#grade');
  if (!g || !editavel()) return;
  let pintando = false;
  const pinta = td => {
    const f = td.dataset.f, d = td.dataset.d; if (!f) return;
    const func = V.funcs.find(x => x.id === f);
    let cod = PINCEL;
    if (cod === '*') { cod = padraoSigla(func, d); if (!cod) { toast(`${func.nome} não tem horário cadastrado (aba Equipe, "Turno mais comum")`, true); return; } }
    else if (cod && !OUTROS[cod] && !turnoEm(cod, d)) {
      // mesmo horário com outra versão nesse dia (ex.: antes de 16/12): usa a versão que vale
      toast('Esse horário não vale nesse dia', true); return;
    }
    GRADE[f] = GRADE[f] || {};
    if ((GRADE[f][d] || '') === cod) return;
    if (cod) GRADE[f][d] = cod; else delete GRADE[f][d];
    const t = cod && !OUTROS[cod] && turnoEm(cod, d);
    td.textContent = PINCEL === '*' && celulaEstilo(DEP) === 'vazio' ? '' : t ? horaCurta(t, d) : cod;
    td.className = `c ${PINCEL === '*' ? 'kpad' : t ? 'kout' : cod ? OUTROS[cod].cls : 'vazio'} ${[0, 6].includes(dow(d)) ? 'fds' : ''} ${FERIADOS[d] ? 'fer' : ''} ${dow(d) === 1 ? 'seg' : ''}`;
    mudou();
  };
  g.addEventListener('pointerdown', e => { const td = e.target.closest('td.c'); if (!td) return; pintando = e.pointerType === 'mouse'; pinta(td); });
  g.addEventListener('pointerover', e => { if (!pintando) return; const td = e.target.closest('td.c'); if (td) pinta(td); });
  window.onpointerup = () => { if (pintando) { pintando = false; } if (pendenteRender) { pendenteRender = false; rerender(); } };
}

// Depois de pintar: salva (com atraso) e revalida
let salvarT = null, sujo = false, salvando = null, pendenteRender = false, ultimoSalvo = null;
function mudou(){
  sujo = true; mostrarSalvo();
  clearTimeout(salvarT); salvarT = setTimeout(salvarAgora, 1200);
  pendenteRender = true; clearTimeout(mudou.t); mudou.t = setTimeout(() => { if (pendenteRender) { pendenteRender = false; rerender(); } }, 350);
}
function rerender(){
  const w = $('#wrap'), sx = w ? w.scrollLeft : 0, sy = w ? w.scrollTop : 0, wy = window.scrollY;
  renderEscala();
  const w2 = $('#wrap'); if (w2) { w2.scrollLeft = sx; w2.scrollTop = sy; } window.scrollTo(0, wy);
}
function mostrarSalvo(){
  const el = $('#salvoInfo'); if (!el) return;
  el.textContent = sujo ? 'Salvando…' : ultimoSalvo ? `Salvo às ${ultimoSalvo}` : '';
}
async function salvarAgora(){
  clearTimeout(salvarT);
  if (salvando) await salvando;
  if (!sujo) return;
  sujo = false;
  const grade = {}; for (const [f, dias] of Object.entries(GRADE)) { const x = Object.fromEntries(Object.entries(dias || {}).filter(([, c]) => c)); if (Object.keys(x).length) grade[f] = x; }
  salvando = rpc('esc_salvar', { p_pin: S.pin, p_predio: PREDIO, p_dep: DEP, p_mes: MES, p_grade: grade, p_turnos: D.turnos })
    .then(r => {
      ultimoSalvo = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      if (!E.escala) { E.escala = { id: r.id, status: r.status }; D.escalas = (D.escalas || []).concat([{ id: r.id, departamento: DEP, status: r.status }]); if (ABA === 'escala') rerender(); }
      E.escala.grade = grade;
      mostrarSalvo();
    })
    .catch(e => { sujo = true; toast('Não salvou: ' + e.message, true); mostrarSalvo(); })
    .finally(() => { salvando = null; });
  await salvando;
}
window.addEventListener('beforeunload', e => { if (sujo) { salvarAgora(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') salvarAgora(); });

function repetirSemana(){
  if (!confirm('Copiar os dias 1 a 7 para o resto do mês, para todos? Os dias 8 em diante serão substituídos.')) return;
  const dias = V.dias;
  for (const f of V.funcs) {
    const g = GRADE[f.id] = GRADE[f.id] || {};
    for (const d of dias.slice(7)) { const src = dias[(+d.slice(8) - 1) % 7]; if (g[src]) g[d] = g[src]; else delete g[d]; }
  }
  mudou(); pendenteRender = false; rerender();
}
function limpar(){
  if (!confirm('Apagar toda a marcação deste mês?')) return;
  GRADE = {}; mudou(); pendenteRender = false; rerender();
}

async function enviar(){
  sujo = true; // garante que os domingos preenchidos sozinhos também sejam salvos
  await salvarAgora();
  V = validar();
  if (V.bloqueios) { toast('Corrija os bloqueios antes de enviar', true); return; }
  const msg = V.alertas ? `Há ${V.alertas} alerta(s). Enviar assim mesmo para o Gerente Geral?` : 'Enviar a escala para o Gerente Geral aprovar?';
  if (!confirm(msg)) return;
  acao('enviar', null, { bloqueios: V.bloqueios, alertas: V.alertas });
}
function devolver(){
  const ov = modal(`<h3>Devolver a escala</h3><div class="hint">O líder vê o motivo e corrige.</div>
    <label class="fld">Motivo<textarea id="mot" rows="3" placeholder="Ex.: a Maria pediu folga no dia 24"></textarea></label>
    <div class="acts"><button class="btn danger" id="ok">Devolver</button></div>`);
  ov.querySelector('#ok').onclick = async () => { const m = ov.querySelector('#mot').value.trim(); if (!m) { toast('Escreva o motivo', true); return; } ov.remove(); acao('devolver', m); };
}
function reabrir(){
  const st = E.escala.status;
  if (!confirm(st === 'aprovada' ? 'Reabrir a escala aprovada? Ela volta para rascunho e precisa ser aprovada de novo.' : 'Reabrir para editar? O envio é cancelado.')) return;
  acao('reabrir');
}
async function acao(a, motivo, resumo){
  try {
    await rpc('esc_acao', { p_pin: S.pin, p_escala: E.escala.id, p_acao: a, p_motivo: motivo || null, p_resumo: resumo || null });
    toast({ enviar: 'Enviada para aprovação', aprovar: 'Escala aprovada', devolver: 'Escala devolvida', reabrir: 'Escala reaberta' }[a]);
    carregarEscala();
  } catch (e) { toast(e.message, true); }
}

/* ================= Exportar (imagem e impressão) ================= */
function montarExport(){
  const st = E.escala ? E.escala.status : 'nova';
  V = validar();
  const dias = V.dias;
  let h = `<h2 class="mes">${esc(nomePer(MES).toUpperCase())}</h2><div style="font-size:14px;font-weight:600;margin-bottom:4px">${datasPer(MES)}</div><h2>Escala de trabalho · ${esc(nomePredio())} · ${esc(DEPTOS[DEP])}</h2>
    <div class="sub">${st === 'aprovada' ? `Aprovada por ${esc(E.escala.aprovada_por)} em ${quando(E.escala.aprovada_em)}` : `<span class="marca">${st === 'enviada' ? 'AGUARDANDO APROVAÇÃO' : 'RASCUNHO · NÃO APROVADA'}</span>`}</div>
    <div style="font-size:13px;font-weight:600;margin:0 0 6px">${esc(folgasPrevistas().texto)}</div>
    ${tabelaEscala({ ed: false, marcas: false })}
    <div style="margin-top:10px;font-size:12px">Legenda: ${celulaEstilo(DEP) === 'vazio' ? 'em branco = trabalha no horário da pessoa' : 'horário = trabalho (verde-claro = horário da pessoa)'} · ${Object.entries(OUTROS).filter(([k]) => k !== 'NA').map(([k, o]) => `<b>${k}</b> = ${o.nome.toLowerCase()}`).join(' · ')} · fundo cinza-azulado = fim de semana${dias.some(d => FERIADOS[d]) ? ` · fundo pêssego = feriado (${dias.filter(d => FERIADOS[d]).map(d => `${ddmm(d)} ${esc(FERIADOS[d])}`).join(', ')})` : ''}</div>

// Impressão e imagem sempre com as cores claras (o papel é branco)
let temaAntesDeImprimir = null;
async function imprimir(){
  await salvarAgora();
  temaAntesDeImprimir = document.documentElement.dataset.theme; document.documentElement.dataset.theme = 'light';
  montarExport(); setTimeout(() => window.print(), 50);
}
function carregarScript(src){ return new Promise((ok, err) => { if (window.html2canvas) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => err(new Error('Sem conexão para gerar a imagem')); document.head.appendChild(s); }); }
async function imagem(){
  await salvarAgora();
  const tema = document.documentElement.dataset.theme;
  try {
    await carregarScript(H2C_URL);
    document.documentElement.dataset.theme = 'light'; montarExport();
    const canvas = await html2canvas($('#exportar'), { scale: 2, backgroundColor: '#ffffff' });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const nome = `escala-${DEP}-${PREDIO}-${MES.slice(0, 7)}.png`, file = new File([blob], nome, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Escala' }); } catch {} }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
  } catch (e) { toast(e.message, true); }
  finally { aplicarTema(tema); $('#exportar').innerHTML = ''; }
}
window.addEventListener('afterprint', () => { $('#exportar').innerHTML = ''; if (temaAntesDeImprimir) { aplicarTema(temaAntesDeImprimir); temaAntesDeImprimir = null; } });

/* ================= Aba Equipe ================= */
function renderEquipe(){
  let h = `<p class="hint">Quem entra na escala de cada departamento. O sexo é necessário para a regra do domingo (mulher: folga no domingo a cada 15 dias).</p>`;
  for (const dep of deptosVisiveis()) {
    const fs = D.funcionarios.filter(f => f.departamento === dep).sort((a, b) => (b.ativo - a.ativo) || a.nome.localeCompare(b.nome, 'pt-BR'));
    h += `<div class="sec-t">${DEPTOS[dep]} <span class="grow">${fs.filter(f => f.ativo).length} ativos</span>${podeMontar(dep) ? `<button class="btn sec" data-novo="${dep}">+ Pessoa</button>` : ''}</div>`;
    h += fs.length ? `<div class="tbl">${fs.map(f => `<div class="li ${f.ativo ? '' : 'off'} ${podeMontar(dep) ? '' : 'ro'}" data-id="${f.id}">
        <div class="t">${esc(f.nome)}<small>${esc(f.cargo || '')}${f.turno_padrao ? ' · turno ' + esc(f.turno_padrao) : ''}${f.ativo ? '' : ' · inativo'}</small></div>
        ${f.sem_regras ? '<span class="tagx">Não CLT</span>' : f.sexo ? `<span class="tagx">${f.sexo === 'F' ? 'Mulher' : 'Homem'}</span>` : '<span class="tagx bad">Sexo?</span>'}</div>`).join('')}</div>`
      : `<div class="empty">Ninguém cadastrado.</div>`;
  }
  $('#conteudo').innerHTML = h;
  $('#conteudo').onclick = e => {
    const n = e.target.closest('[data-novo]'); if (n) return editarFunc({ departamento: n.dataset.novo, ativo: true });

    <div class="grid2"><label class="fld">Departamento<select id="fDep">${deps.map(d => `<option value="${d}" ${d === f.departamento ? 'selected' : ''}>${DEPTOS[d]}</option>`).join('')}</select></label>

    <label class="chk"><input type="checkbox" id="fSemRegras" ${f.sem_regras ? 'checked' : ''}> Cooperada / não CLT (fica fora das regras de horas, folgas e domingos)</label>
    ${f.id ? `<label class="chk"><input type="checkbox" id="fAtivo" ${f.ativo ? 'checked' : ''}> Ativo (desmarque quando sair da equipe)</label>` : ''}

  ov.querySelector('#ok').onclick = async () => {

      departamento: ov.querySelector('#fDep').value, turno_padrao: ov.querySelector('#fTurno').value, ativo: f.id ? ov.querySelector('#fAtivo').checked : true,
      sem_regras: ov.querySelector('#fSemRegras').checked, secao: ov.querySelector('#fSecao').value };
    if (!p.nome.trim()) { toast('Informe o nome', true); return; }
    try { await rpc('esc_funcionario_salvar', { p_pin: S.pin, p_predio: PREDIO, p }); ov.remove(); toast('Salvo'); await recarregarDados(); }
    catch (e) { toast(e.message, true); }

async function recarregarDados(){ D = await rpc('esc_dados', { p_pin: S.pin, p_predio: PREDIO, p_mes: MES }); render(); }

/* ================= Aba Turnos ================= */
function renderTurnos(){
  const pode = t => podeTurnos() || (papel() === 'montador' && (t.departamentos || []).length === 1 && t.departamentos[0] === S.user.departamento);
  const novo = podeTurnos() || papel() === 'montador';
  let h = `<p class="hint">O Gerente Geral altera qualquer turno; o líder altera os turnos só do departamento dele. Um turno pode ter <b>versões por data</b> (mesma sigla, horário que muda a partir de um dia, como na mudança de 16/12/2026): crie outra versão com "Vale a partir de" e feche a antiga com "Vale até". Escalas já salvas guardam os horários do dia em que foram salvas.</p>`;
  for (const dep of deptosVisiveis()) {
    const ts = D.turnos.filter(t => doDep(t, dep)).sort((a, b) => (a.ordem - b.ordem) || a.sigla.localeCompare(b.sigla) || (a.desde || '').localeCompare(b.desde || ''));
    h += `<div class="sec-t">Turnos · ${DEPTOS[dep]} <span class="grow"></span>${novo && podeMontar(dep) ? `<button class="btn sec" data-novot="${dep}">+ Turno</button>` : ''}</div><div class="tbl">`;
    h += ts.map(t => { const j = jornada(t, t.desde || '2026-12-07'), erros = checarTurno(t), venc = t.ate && t.ate < hojeISO();
      return `<div class="li ${pode(t) ? '' : 'ro'} ${venc ? 'off' : ''}" data-t="${t.id}"><b class="pc ${corTurno(t.sigla)}" style="pointer-events:none">${esc(t.sigla)}</b>
        <div class="t">${esc(t.nome)} · ${textoTurno(t)}${periodo(t)}<small>${hm(j.trab)} de trabalho + ${t.intervalo_min} min de intervalo · ${(t.departamentos || []).map(d => DEPTOS[d]).join(', ')}</small></div>
        ${erros.some(x => x.n === 'e') ? '<span class="tagx bad">Fora da lei</span>' : erros.length ? '<span class="tagx" title="Acima de 8h por dia: precisa de acordo ou convenção">+8h</span>' : ''}</div>`; }).join('') || '<div class="empty">Nenhum turno.</div>';
    h += '</div>';
  }
  // Cobertura mínima
  h += `<div class="sec-t">Mínimo de pessoas por turno (alerta na escala)</div><div class="tbl">`;
  for (const dep of deptosVisiveis()) {
    const cob = cobertura(dep), ed = podeMontar(dep);
    h += `<div class="li ro" style="flex-wrap:wrap"><div class="t">${DEPTOS[dep]}<small><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-dom="${dep}" ${fechaDomingo(dep) ? 'checked' : ''} ${ed ? '' : 'disabled'}> Não funciona aos domingos (domingo = folga)</label></small></div>${turnosDoDep(dep).map(t => `<label class="hint" style="display:flex;align-items:center;gap:4px">${esc(t.sigla)} <input type="number" min="0" max="20" value="${+cob[t.sigla] || 0}" data-dep="${dep}" data-s="${esc(t.sigla)}" style="width:56px;padding:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--field);color:var(--ink)" ${ed ? '' : 'disabled'}></label>`).join('')}</div>`;
  }
  h += '</div>';
  $('#conteudo').innerHTML = h;
  $('#conteudo').onclick = e => {
    const nt = e.target.closest('[data-novot]'); if (nt) return editarTurno({ intervalo_min: 60, departamentos: [nt.dataset.novot] });
    const li = e.target.closest('.li[data-t]'); if (!li || li.classList.contains('ro')) return;
    editarTurno(D.turnos.find(t => String(t.id) === li.dataset.t));
  };
  $('#conteudo').querySelectorAll('input[data-dep]').forEach(inp => inp.onchange = async () => {
    const dep = inp.dataset.dep, cob = {};
    $('#conteudo').querySelectorAll(`input[data-dep="${dep}"]`).forEach(i => { if (+i.value > 0) cob[i.dataset.s] = +i.value; });
    try { await rpc('esc_config_salvar', { p_pin: S.pin, p_predio: PREDIO, p_dep: dep, p_cobertura: cob, p_fecha_domingo: null }); D.config = { ...(D.config || {}), [dep]: { ...((D.config || {})[dep] || {}), cobertura: cob } }; toast('Salvo'); }
    catch (e) { toast(e.message, true); }
  });
  $('#conteudo').querySelectorAll('input[data-dom]').forEach(inp => inp.onchange = async () => {
    const dep = inp.dataset.dom;
    try { await rpc('esc_config_salvar', { p_pin: S.pin, p_predio: PREDIO, p_dep: dep, p_cobertura: null, p_fecha_domingo: inp.checked }); D.config = { ...(D.config || {}), [dep]: { ...((D.config || {})[dep] || {}), fecha_domingo: inp.checked } }; toast('Salvo'); }
    catch (e) { toast(e.message, true); inp.checked = !inp.checked; }
  });
}
function editarTurno(t){
  const ov = modal(`<h3>${t.id ? 'Editar turno' : 'Novo turno'}</h3>
    <div class="grid2"><label class="fld">Sigla<input id="tS" maxlength="3" value="${esc(t.sigla || '')}" placeholder="Ex.: M"></label>
    <label class="fld">Nome<input id="tN" value="${esc(t.nome || '')}" placeholder="Ex.: Manhã"></label></div>
    <div class="grid3"><label class="fld">Entrada (seg–sex)<input type="time" id="tI" value="${hhmm(t.inicio)}"></label>
    <label class="fld">Saída (seg–sex)<input type="time" id="tF" value="${hhmm(t.fim)}"></label>
    <label class="fld">Intervalo (min)<input type="number" id="tIv" min="0" max="180" value="${t.intervalo_min ?? 60}"></label></div>
    <div class="grid2"><label class="fld">Entrada sáb/dom (se for diferente)<input type="time" id="tIf" value="${hhmm(t.inicio_fds)}"></label>
    <label class="fld">Saída sáb/dom<input type="time" id="tFf" value="${hhmm(t.fim_fds)}"></label></div>
    <div class="grid2"><label class="fld">Vale a partir de (opcional)<input type="date" id="tDe" value="${t.desde || ''}"></label>
    <label class="fld">Vale até (opcional)<input type="date" id="tAte" value="${t.ate || ''}"></label></div>
    <div class="fld">Departamentos</div>${Object.entries(DEPTOS).filter(([k]) => podeTurnos() || k === S.user.departamento).map(([k, n]) => `<label class="chk"><input type="checkbox" value="${k}" class="tD" ${(t.departamentos || []).includes(k) ? 'checked' : ''} ${podeTurnos() ? '' : 'disabled'}> ${n}</label>`).join('')}
    ${t.id ? '<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn link" id="nv">Criar nova versão a partir de uma data</button></div>' : ''}
    <div class="msgs" id="tMsgs"></div>
    <div class="acts">${t.id ? '<button class="btn danger" id="del">Desativar</button><span class="grow"></span>' : ''}<button class="btn" id="ok">Salvar</button></div>`);
  const ler = () => ({ id: t.id || null, sigla: ov.querySelector('#tS').value.trim().toUpperCase(), nome: ov.querySelector('#tN').value.trim(),
    inicio: ov.querySelector('#tI').value, fim: ov.querySelector('#tF').value, intervalo_min: +ov.querySelector('#tIv').value,
    inicio_fds: ov.querySelector('#tIf').value, fim_fds: ov.querySelector('#tFf').value,
    desde: ov.querySelector('#tDe').value, ate: ov.querySelector('#tAte').value,
    departamentos: [...ov.querySelectorAll('.tD:checked')].map(c => c.value), ativo: true });
  const checar = () => {
    const p = ler(), out = [];
    if (!/^[A-Z0-9]{1,3}$/.test(p.sigla)) out.push({ n: 'e', t: 'Sigla: 1 a 3 letras ou números' });
    if (OUTROS[p.sigla]) out.push({ n: 'e', t: `A sigla ${p.sigla} é reservada (${OUTROS[p.sigla].nome})` });
    if (p.desde && p.ate && p.ate < p.desde) out.push({ n: 'e', t: '"Vale até" é antes de "Vale a partir de"' });
    // Mesma sigla pode ter várias versões, desde que os períodos não se cruzem
    const cruza = D.turnos.find(x => x.sigla === p.sigla && x.id !== t.id && (!x.desde || !p.ate || x.desde <= p.ate) && (!x.ate || !p.desde || p.desde <= x.ate));
    if (cruza) out.push({ n: 'e', t: `Já existe o turno ${cruza.sigla} ${textoTurno(cruza)}${periodo(cruza) || ' sem data'}; ajuste as datas para os períodos não se cruzarem` });
    if (!p.nome) out.push({ n: 'e', t: 'Informe o nome' });
    if (!p.inicio || !p.fim) out.push({ n: 'e', t: 'Informe entrada e saída' });
    if (!!p.inicio_fds !== !!p.fim_fds) out.push({ n: 'e', t: 'Sábado/domingo: informe entrada e saída, ou deixe os dois em branco' });
    if (!p.departamentos.length) out.push({ n: 'e', t: 'Marque ao menos um departamento' });
    if (p.inicio && p.fim) { out.push(...checarTurno(p)); const j = jornada(p, '2026-12-07'); out.push({ n: 'i', t: `Seg–sex: ${hm(j.trab)} de trabalho por dia; 5 dias = ${hm(j.trab * 5)} na semana (limite ${regraEm(hojeISO() < '2026-12-16' ? '2026-12-16' : hojeISO()).horas}h)` }); }
    ov.querySelector('#tMsgs').innerHTML = out.map(m => `<div class="${m.n}">${esc(m.t)}</div>`).join('');
    return out;
  };
  ov.querySelectorAll('input').forEach(i => i.oninput = checar); checar();
  const nv = ov.querySelector('#nv');
  if (nv) nv.onclick = () => {
    const d = prompt('A nova versão vale a partir de qual dia? (dd/mm/aaaa)', '16/12/2026'); if (!d) return;
    const m = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (!m) { toast('Data inválida', true); return; }
    const iso = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    if (t.desde && iso <= t.desde) { toast('A data tem de ser depois do início desta versão', true); return; }
    ov.remove();
    // fecha esta versão na véspera e abre a nova com os mesmos dados, para o líder ajustar o horário
    rpc('esc_turno_salvar', { p_pin: S.pin, p_predio: PREDIO, p: { ...t, inicio: hhmm(t.inicio), fim: hhmm(t.fim), inicio_fds: hhmm(t.inicio_fds), fim_fds: hhmm(t.fim_fds), ate: addDias(iso, -1), desde: t.desde || '' } })
      .then(() => recarregarDados())
      .then(() => editarTurno({ ...t, id: null, desde: iso, ate: t.ate && t.ate >= iso ? t.ate : '' }))
      .catch(e => toast(e.message, true));
  };
  ov.querySelector('#ok').onclick = async () => {
    if (checar().some(m => m.n === 'e')) { toast('Corrija os erros do turno', true); return; }
    try { await rpc('esc_turno_salvar', { p_pin: S.pin, p_predio: PREDIO, p: ler() }); ov.remove(); toast('Turno salvo'); await recarregarDados(); }
    catch (e) { toast(e.message, true); }
  };
  const del = ov.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!confirm('Desativar este turno? Ele some da paleta; escalas que já o usam passam a mostrar erro até serem trocadas.')) return;
    try { await rpc('esc_turno_salvar', { p_pin: S.pin, p_predio: PREDIO, p: { ...ler(), ativo: false } }); ov.remove(); await recarregarDados(); }
    catch (e) { toast(e.message, true); }
  };
}

    ${R('Jornada diária', 'b', 'Padrão da 5x2: 8h24 de trabalho + 1h de intervalo (9h24 entre entrada e saída). Acima de 8h24 aparece alerta (hora extra); acima de 10h bloqueia.', 'Premissas JFL 5x2, item 01; CLT art. 59')}
    ${R('Todos os dias marcados', 'b', 'Cada pessoa precisa ter um código em todos os dias do mês: um turno ou X folga, FC compensa feriado, FP preferência de folga, XX folga aniversário, BH banco de horas, FE férias, AT atestado, F falta, NA não se aplica (antes da admissão ou depois do desligamento). Feriados aparecem destacados no topo da grade.', 'Regra do app')}
    ${R('Sexo informado', 'b', 'Necessário para aplicar a regra do domingo.', 'Regra do app')}
    ${R('Departamento fechado no domingo', 'b', 'Governança e Manutenção não funcionam aos domingos: o domingo já vem marcado como folga e não aceita turno. Muda na aba Turnos.', 'Regra da operação')}
    ${R('Mínimo de pessoas por turno', 'a', 'Configurado na aba Turnos, por departamento (ex.: Recepção com ao menos 1 em cada turno).', 'Regra da operação')}
  </div>
  <p class="hint" style="margin-top:14px">Fluxo: o líder monta (governanta na Governança, líder de manutenção na Manutenção, gerente assistente na Recepção) → envia → o Gerente Geral aprova ou devolve com o motivo. Escala aprovada só muda se for reaberta, e aí precisa de nova aprovação.</p>`;
}

/* ================= Aba Acessos ================= */
async function renderAcessos(){
  $('#conteudo').innerHTML = '<div class="empty">Carregando…</div>';
  let us;
  try { us = await rpc('esc_usuarios_listar', { p_pin: S.pin, p_predio: PREDIO }); }
  catch (e) { $('#conteudo').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  $('#conteudo').innerHTML = `<p class="hint">Só os líderes entram no app, cada um com um PIN de 4 dígitos.</p>
    <div class="sec-t">Acessos · ${esc(nomePredio())}<span class="grow"></span><button class="btn sec" id="bNovoU">+ Acesso</button></div>
    <div class="tbl">${us.map(u => `<div class="li ${u.ativo ? '' : 'off'}" data-u="${u.id}"><div class="t">${esc(u.nome)}${u.titulo ? ' · ' + esc(u.titulo) : ''}<small>${PAPEIS[u.papel]}${u.departamento ? ' · ' + DEPTOS[u.departamento] : ''}${u.predio ? '' : ' · todos os prédios'}${u.ativo ? '' : ' · desativado'}</small></div></div>`).join('')}</div>`;
  $('#bNovoU').onclick = () => editarUsuario({ papel: 'montador', ativo: true });
  $('#conteudo').querySelectorAll('.li[data-u]').forEach(li => li.onclick = () => editarUsuario(us.find(u => u.id === li.dataset.u)));
}
function editarUsuario(u){
  const papeis = Object.entries(PAPEIS).filter(([k]) => k !== 'admin' || papel() === 'admin');
  const ov = modal(`<h3>${u.id ? 'Editar acesso' : 'Novo acesso'}</h3>
    <div class="grid2"><label class="fld">Nome<input id="uN" value="${esc(u.nome || '')}"></label>
    <label class="fld">Cargo (aparece no topo)<input id="uT" value="${esc(u.titulo || '')}" placeholder="Ex.: Governanta"></label></div>
    <label class="fld">Perfil<select id="uP">${papeis.map(([k, n]) => `<option value="${k}" ${k === u.papel ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label class="fld" id="uDw">Departamento<select id="uD">${Object.entries(DEPTOS).map(([k, n]) => `<option value="${k}" ${k === u.departamento ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label class="fld">PIN (4 dígitos)${u.id ? ' · deixe em branco para manter' : ''}<input id="uPin" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    ${u.id ? `<label class="chk"><input type="checkbox" id="uA" ${u.ativo ? 'checked' : ''}> Ativo</label>` : ''}
    <div class="hint" style="margin-top:8px">Novo acesso fica no prédio ${esc(nomePredio())}.</div>
    <div class="acts"><button class="btn" id="ok">Salvar</button></div>`);
  const dep = () => ov.querySelector('#uDw').classList.toggle('hidden', ov.querySelector('#uP').value !== 'montador');
  ov.querySelector('#uP').onchange = dep; dep();
  ov.querySelector('#ok').onclick = async () => {
    const pin = ov.querySelector('#uPin').value.trim(), pp = ov.querySelector('#uP').value;
    if (pin && !/^\d{4}$/.test(pin)) { toast('O PIN tem 4 dígitos', true); return; }
    const p = { id: u.id || null, nome: ov.querySelector('#uN').value, titulo: ov.querySelector('#uT').value, papel: pp,
      departamento: pp === 'montador' ? ov.querySelector('#uD').value : '', pin, ativo: u.id ? ov.querySelector('#uA').checked : true };
    if (!p.nome.trim()) { toast('Informe o nome', true); return; }
    try { await rpc('esc_usuario_salvar', { p_pin: S.pin, p_predio: PREDIO, p }); ov.remove(); toast('Salvo'); renderAcessos(); }
    catch (e) { toast(e.message, true); }
  };
}

/* ================= Início ================= */
buildPad();
(function(){ const s = store.get('sessao'); if (s && s.pin && s.user) { S = s; start(); } })();
</script>
